
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dziękujemy za zamówienie | Saveria</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #fff8f6;
      color: #594747;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 540px;
      padding: 40px 26px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #f0dedb;
      border-radius: 24px;
      box-shadow: 0 10px 35px rgba(120, 75, 75, 0.07);
    }

    .flower {
      font-size: 52px;
      margin-bottom: 12px;
    }

    h1 {
      color: #9b6c73;
      font-size: 30px;
    }

    p {
      line-height: 1.7;
    }

    .button {
      display: inline-block;
      margin-top: 18px;
      padding: 14px 24px;
      border-radius: 12px;
      background: #bc8992;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .note {
      margin-top: 24px;
      color: #8a7777;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="flower">🌸</div>
    <h1>Dziękujemy za zamówienie!</h1>
    <p>
      Dziękujemy za zakupy w Saverii.
      Twoje zamówienie zostało przyjęte.
    </p>
    <p>
      Jeśli płatność została zakończona, otrzymasz dalsze informacje
      na podany adres e-mail.
    </p>
    <a class="button" href="index.html">Wróć do strony głównej</a>
    <p class="note">
      W razie pytań skontaktuj się z obsługą sklepu.
    </p>
  </main>
</body>
</html>
