<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koszyk — Saveria</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fffaf8;
      color: #493b3b;
      font-family: Arial, sans-serif;
    }
    header {
      background: #f8e8e5;
      padding: 18px 5%;
      border-bottom: 1px solid #efd8d2;
    }
    .nav {
      max-width: 1000px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    a { color: inherit; text-decoration: none; }
    .brand { font-size: 22px; font-weight: bold; }
    nav { display: flex; gap: 16px; flex-wrap: wrap; }
    main { max-width: 900px; margin: 35px auto; padding: 0 18px; }
    h1 { color: #805b63; }
    .cart-item {
      background: white;
      border: 1px solid #f0dfda;
      border-radius: 14px;
      padding: 16px;
      margin: 12px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .item-name { font-weight: bold; }
    .item-controls { display: flex; align-items: center; gap: 10px; }
    button {
      cursor: pointer;
      border: 1px solid #dfb9b6;
      background: white;
      color: #68474d;
      padding: 9px 13px;
      border-radius: 18px;
    }
    .primary {
      background: #d9a9ad;
      color: white;
      border: 0;
      padding: 12px 18px;
    }
    .total { font-size: 22px; font-weight: bold; margin: 24px 0; }
    .empty { padding: 20px 0; }
  </style>
</head>
<body>
  <header>
    <div class="nav">
      <a class="brand" href="index.html">Saveria ♥</a>
      <nav>
        <a href="index.html">Strona główna</a>
        <a href="produkty.html">Produkty</a>
        <a href="koszyk.html">Koszyk 🛍️</a>
      </nav>
    </div>
  </header>

  <main>
    <h1>Twój koszyk 🌸</h1>
    <div id="cartItems"></div>
    <p class="total" id="total"></p>
    <p id="message"></p>
    <a href="produkty.html">← Wróć do produktów</a>
  </main>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabase = createClient(
      "https://mzshkdilydgmxjtyowdh.supabase.co",
      "sb_publishable_x7NU2M5TvynbEwec4gLQSw_j_MQpxF5"
    );

    const CART_KEY = "saveriaCart";
    let products = [];
    let cart = [];

    const money = value => new Intl.NumberFormat("pl-PL", {
      style: "currency",
      currency: "PLN"
    }).format(value);

    function readCart() {
      try {
        const saved = JSON.parse(localStorage.getItem(CART_KEY) || "[]");
        return Array.isArray(saved) ? saved.filter(item =>
          typeof item.id === "string" &&
          Number.isInteger(item.qty) && item.qty > 0
        ) : [];
      } catch {
        return [];
      }
    }

    function saveCart() {
      localStorage.setItem(CART_KEY, JSON.stringify(cart));
    }

    function renderCart() {
      const container = document.querySelector("#cartItems");

      const validCart = cart.filter(item =>
        products.some(product => product.id === item.id)
      );

      if (validCart.length !== cart.length) {
        cart = validCart;
        saveCart();
      }

      if (!cart.length) {
        container.innerHTML = '<p class="empty">Twój koszyk jest pusty 💗</p>';
        document.querySelector("#total").textContent = "";
        return;
      }

      container.innerHTML = cart.map(item => {
        const product = products.find(p => p.id === item.id);
        if (!product) return "";

        return `
          <div class="cart-item">
            <div>
              <div class="item-name">${product.name}</div>
              <div>${money(product.price)} / szt.</div>
            </div>
            <div class="item-controls">
              <button data-minus="${product.id}" aria-label="Zmniejsz ilość">−</button>
              <span>${item.qty}</span>
              <button data-plus="${product.id}" aria-label="Zwiększ ilość">+</button>
              <button data-remove="${product.id}">Usuń</button>
            </div>
            <strong>${money(Number(product.price) * item.qty)}</strong>
          </div>
        `;
      }).join("");

      const total = cart.reduce((sum, item) => {
        const product = products.find(p => p.id === item.id);
        return sum + (product ? Number(product.price) * item.qty : 0);
      }, 0);

      document.querySelector("#total").textContent =
        "Razem za produkty: " + money(total);

      document.querySelector("#message").textContent =
        "Koszt dostawy i ewentualny rabat zostaną obliczone przy składaniu zamówienia.";
    }

    document.addEventListener("click", event => {
      const plus = event.target.closest("[data-plus]");
      const minus = event.target.closest("[data-minus]");
      const remove = event.target.closest("[data-remove]");

      if (plus) {
        const item = cart.find(item => item.id === plus.dataset.plus);
        if (item) item.qty += 1;
      } else if (minus) {
        const item = cart.find(item => item.id === minus.dataset.minus);
        if (item) {
          item.qty -= 1;
          if (item.qty <= 0) {
            cart = cart.filter(entry => entry.id !== minus.dataset.minus);
          }
        }
      } else if (remove) {
        cart = cart.filter(item => item.id !== remove.dataset.remove);
      } else {
        return;
      }

      saveCart();
      renderCart();
    });

    async function init() {
      cart = readCart();

      const { data, error } = await supabase
        .from("products")
        .select("id, name, price, active")
        .eq("active", true);

      if (error) {
        document.querySelector("#cartItems").textContent =
          "Nie udało się pobrać produktów. Odśwież stronę i spróbuj ponownie.";
        console.error(error);
        return;
      }

      products = data || [];
      renderCart();
    }

    init();
  </script>
</body>
</html>
